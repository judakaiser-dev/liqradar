  <body>
    <div id="root"></div>
    <script>
      // Start-Wächter: bleibt die App leer ODER ungestylt (z. B. fehlende/veraltete
      // Datei nach einem Update), einmal automatisch neu laden — danach Reparatur anbieten.
      (function () {
        function broken() {
          var root = document.getElementById('root')
          if (!root || root.childElementCount === 0) return true
          try {
            var bg = getComputedStyle(document.body).backgroundColor
            if (bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') return true // Stylesheet fehlt
          } catch (e) {}
          return false
        }
        function recover() {
          if (!broken()) return
          var tried = false
          try { tried = sessionStorage.getItem('liqradar-bootretry') === '1' } catch (e) {}
          if (!tried) {
            try { sessionStorage.setItem('liqradar-bootretry', '1') } catch (e) {}
            var u = new URL(location.href)
            u.searchParams.set('neu', Date.now().toString(36))
            location.replace(u.toString())
            return
          }
          var d = document.createElement('div')
          d.style.cssText = 'position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#050810;color:#ebebeb;font-family:system-ui,sans-serif;padding:24px;text-align:center'
          d.innerHTML =
            '<div><div style="font-size:18px;font-weight:700;margin-bottom:8px">LIQRADAR konnte nicht geladen werden</div>' +
            '<div style="font-size:13px;opacity:.7;margin-bottom:16px">Meist hilft ein einmaliges Leeren des App-Caches.</div>' +
            '<button id="liqradar-recover" style="background:#22d3ee;color:#050810;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer">Cache leeren &amp; neu laden</button></div>'
          document.body.appendChild(d)
          document.getElementById('liqradar-recover').onclick = async function () {
            try {
              if ('serviceWorker' in navigator) {
                var regs = await navigator.serviceWorker.getRegistrations()
                for (var i = 0; i < regs.length; i++) await regs[i].unregister()
              }
              if (window.caches) {
                var keys = await caches.keys()
                for (var j = 0; j < keys.length; j++) await caches.delete(keys[j])
              }
              try { sessionStorage.removeItem('liqradar-bootretry') } catch (e) {}
            } catch (e) {}
            var u2 = new URL(location.href)
            u2.searchParams.set('neu', Date.now().toString(36))
            location.replace(u2.toString())
          }
        }
        window.addEventListener('DOMContentLoaded', function () { setTimeout(recover, 8000) })
        // Merker zurücksetzen, sobald die App erfolgreich UND gestylt gerendert hat
        var obs = new MutationObserver(function () {
          if (!broken()) {
            try { sessionStorage.removeItem('liqradar-bootretry') } catch (e) {}
            obs.disconnect()
          }
        })
        if (document.body) obs.observe(document.body, { childList: true, subtree: true })
      })()
    </script>
